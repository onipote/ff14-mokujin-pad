<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAD-MOKUJIN</title>
  <link rel="stylesheet" href="styles/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
</head>
<body>
  <div id="app">

    <!-- ===== Start Screen ===== -->
    <div id="screen-start" class="screen">
      <div class="screen-panel">
        <div class="ornament">◆ ─────── ◆</div>
        <h1 class="game-title">PAD-MOKUJIN</h1>
        <p class="game-sub">XHB 操作練習ツール</p>
        <div class="ornament">◆ ─────── ◆</div>

        <div class="setting-row">
          <div class="setting-label">DIFFICULTY</div>
          <div class="btn-group" id="diff-btns">
            <button class="btn btn--sm" data-value="slow">遅い<br><small>4秒</small></button>
            <button class="btn btn--sm btn--sel" data-value="normal">普通<br><small>2.5秒</small></button>
            <button class="btn btn--sm" data-value="fast">速い<br><small>1.5秒</small></button>
          </div>
        </div>

        <button id="btn-start" class="btn btn--primary" disabled>▶ START</button>
        <p id="pad-required-msg" class="pad-required-msg">コントローラーを接続してください</p>
        <p class="pad-hint">←→: 選択変更 &nbsp;✕: 決定</p>
      </div>
    </div>

    <!-- ===== Game Over Screen ===== -->
    <div id="screen-gameover" class="screen hidden">
      <div class="screen-panel">
        <div class="ornament">◆ ─────── ◆</div>
        <h2 class="gameover-title" id="gameover-heading">GAME OVER</h2>
        <div class="ornament">◆ ─────── ◆</div>
        <div id="new-record-badge" class="new-record hidden">★ NEW RECORD ★</div>
        <div id="gameover-stats" class="gameover-stats"></div>
        <div class="btn-group btn-group--col">
          <button id="btn-retry" class="btn btn--primary">▶ RETRY</button>
          <button id="btn-menu" class="btn">メニューに戻る</button>
        </div>
        <p class="pad-hint">✕: 決定 &nbsp;↑↓: 選択</p>
      </div>
    </div>

    <!-- ===== Pause Screen ===== -->
    <div id="screen-pause" class="screen hidden">
      <div class="screen-panel">
        <div class="ornament">◆ ─────── ◆</div>
        <h2 class="pause-title">PAUSE</h2>
        <div class="ornament">◆ ─────── ◆</div>
        <div class="btn-group btn-group--col">
          <button id="btn-resume" class="btn btn--primary">▶ ゲームを続ける</button>
          <button id="btn-quit" class="btn">メニューへ戻る</button>
        </div>
        <p class="pad-hint">OPTIONS: 再開 &nbsp;✕: 決定 &nbsp;↑↓: 選択</p>
      </div>
    </div>

    <!-- ===== Header ===== -->
    <header id="header">
      <span class="header-title">PAD-MOKUJIN</span>
      <div class="header-right">
        <button id="btn-mute" class="btn-mute" title="ミュート切替">♪</button>
        <span id="pad-status" class="pad-status pad-status--off">PAD: 未接続</span>
      </div>
    </header>

    <!-- ===== Info Bar ===== -->
    <div id="info-bar">
      <div class="info-col info-col--limit">
        <div class="limit-block">
          <div class="info-label limit-break-label">LIMIT BREAK</div>
          <div id="limit-gauge-container" class="limit-gauge-container">
            <div class="limit-segment" id="limit-seg-0">
              <div class="limit-segment-inner">
                <div class="limit-segment-fill"></div>
              </div>
            </div>
            <div class="limit-segment" id="limit-seg-1">
              <div class="limit-segment-inner">
                <div class="limit-segment-fill"></div>
              </div>
            </div>
            <div class="limit-segment" id="limit-seg-2">
              <div class="limit-segment-inner">
                <div class="limit-segment-fill"></div>
              </div>
            </div>
          </div>
          <div id="combo-val"></div>
        </div>
      </div>

      <div class="info-divider"></div>

      <div class="info-col info-col--score">
        <div class="info-label">SCORE</div>
        <div class="info-value-wrap">
          <div id="score-val">0</div>
          <div id="judgment-float" class="judgment-float-container"></div>
        </div>
      </div>

      <div class="info-divider"></div>

      <div class="info-col info-col--timer">
        <div class="info-label">残り時間</div>
        <div class="info-value-wrap">
          <div id="countdown-row" class="countdown-row">
            <i class="fa-regular fa-clock countdown-icon"></i>
            <span id="countdown-val" class="countdown-val">60.0s</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== Game Area ===== -->
    <div id="game-area">

      <!-- スティック / AOE パネル -->
      <div id="stick-area">
        <!-- L パネル -->
        <div class="stick-panel" id="stick-panel-L">
          <div class="stick-field" id="stick-field-L">
            <div class="aoe-zone" id="aoe-zone-L"></div>
            <div class="stick-cursor" id="stick-cursor-L"><span class="cursor-icon">L</span></div>
          </div>
          <div class="stick-side-label">L</div>
        </div>

        <!-- 木人 (中央) -->
        <div id="stick-center">
          <div id="enemy-figure"></div>
        </div>

        <!-- R パネル -->
        <div class="stick-panel" id="stick-panel-R">
          <div class="stick-field" id="stick-field-R">
            <div class="gaze-eye" id="gaze-eye-R"></div>
            <div class="gaze-frame" id="gaze-frame-R"></div>
          </div>
          <div class="stick-side-label">R</div>
        </div>
      </div>

      <div id="timer-label"></div>
    </div>

    <!-- ===== XHB ===== -->
    <div id="xhb-wrap">
      <div id="xhb">
        <div id="xhb-half-L" class="xhb-half">
          <div class="xhb-label">L</div>
          <div class="xhb-groups">
            <div class="xhb-cross" id="xhb-L-dpad"></div>
            <div class="xhb-cross" id="xhb-L-face"></div>
          </div>
        </div>
        <div class="xhb-sep"></div>
        <div id="xhb-half-R" class="xhb-half">
          <div class="xhb-groups">
            <div class="xhb-cross" id="xhb-R-dpad"></div>
            <div class="xhb-cross" id="xhb-R-face"></div>
          </div>
          <div class="xhb-label">R</div>
        </div>
      </div>
    </div>

  </div><!-- /#app -->

  <script src="src/constants.js"></script>
  <script src="src/xhb.js"></script>
  <script src="src/sound.js"></script>
  <script src="src/input.js"></script>
  <script src="src/aoe.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/game.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
